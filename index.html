<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="assets/favicon.png?v=20261112a">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07041c">
<title>NEO JAPAN CLASH（仮）</title>
<link rel="stylesheet" href="style.css?v=20261112a">
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="boot"><div class="bt1">NEO JAPAN CLASH</div><div class="bt2">読み込み中…</div><div class="bt3">30秒たっても始まらないときは、ページを再読み込みしてください</div></div>

<!-- PSP方式の画面上ゲームパッド：左下=十字キー / 右下=△□○×（ダイヤ配置）/ 上部両端=L・R -->
<div id="pad" aria-hidden="true">
  <div id="bL" class="sb">L</div>
  <div id="bR" class="sb">R</div>
  <div id="bMute" class="mini">♪</div>
  <div id="bMenu" class="mini">Ⅱ</div>
  <div id="dpad">
    <div id="dU" class="da"><i></i></div>
    <div id="dL" class="da"><i></i></div>
    <div id="dR" class="da"><i></i></div>
    <div id="dD" class="da"><i></i></div>
    <div class="dc"></div>
  </div>
  <div id="btns">
    <div class="fb tri" data-b="G"><b>△</b><span>ガード</span></div>
    <div class="fb sqr" data-b="S"><b>□</b><span>必殺</span></div>
    <div class="fb cir" data-b="A"><b>○</b><span>弱</span></div>
    <div class="fb crs" data-b="H"><b>×</b><span>強</span></div>
  </div>
</div>

<div id="rotate"><div class="phone"></div><p>横にしてください</p><small>このゲームは横画面専用です</small></div>

<script src="js/data.js?v=20261112a"></script>
<script src="js/sim.js?v=20261112a"></script>
<script src="js/draw.js?v=20261112a"></script>
<script src="js/audio.js?v=20261112a"></script>
<script src="js/input.js?v=20261112a"></script>
<script src="js/net.js?v=20261112a"></script>
<script src="js/shop.js?v=20261112a"></script>
<script src="js/main.js?v=20261112a"></script>
<script>
// 起動ウォッチドッグ：古いキャッシュの混在などで起動が止まった場合、一度だけ開き直して自己回復する
setTimeout(function () {
  var b = document.getElementById('boot'); if (!b) return;
  try {
    if (!sessionStorage.getItem('njc_retry')) { sessionStorage.setItem('njc_retry', '1'); location.replace(location.pathname + '?v=' + Date.now() + location.hash); return; }
  } catch (e) { /* sessionStorage が使えない環境では何もしない */ }
  b.innerHTML = '<div class="bt1">読み込みに失敗しました</div><div class="bt2">通信環境の良い場所で、もう一度開いてください</div>';
}, 10000);
</script>
</body>
</html>
